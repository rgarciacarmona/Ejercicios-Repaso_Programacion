name: Sync Overleaf to docs folder

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean docs folder
        run: |
          mkdir -p docs
          # Remove everything: docs is regenerated in full from Overleaf
          find docs -type f -delete
          find docs -type d -empty -delete

      - name: Sync Overleaf files to docs
        run: |
          git remote add overleaf https://git:${{ secrets.OVERLEAF_GIT_TOKEN }}@git.overleaf.com/${{ secrets.OVERLEAF_PROJECT_ID }}.git || true
          git fetch overleaf main

          mkdir -p docs
          git archive overleaf/main | tar -x -C docs/

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Ejercicios-Repaso_Programacion.tex
          working_directory: docs/

      - name: Remove LaTeX auxiliary files
        run: |
          cd docs/
          # find, not globs: latexmk also leaves artefacts in subdirectories
          find . \( -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.toc' \
            -o -name '*.fls' -o -name '*.fdb_latexmk' -o -name '*.synctex.gz' \
            -o -name '*.bbl' -o -name '*.blg' -o -name '*-eps-converted-to.pdf' \) -delete
          sudo rm -rf _minted*

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/

          if ! git diff --cached --quiet; then
            git commit -m "Sync Overleaf project and compile PDF"
            git push
          fi
